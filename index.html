<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Clip Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .stat-box {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        .video-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .clips-list {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 800px;
            overflow-y: auto;
        }

        video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            max-height: 600px;
        }

        .clip-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .clip-info h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .clip-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px;
            font-size: 0.95em;
        }

        .clip-meta-label {
            font-weight: bold;
            color: #666;
        }

        .clip-meta-value {
            color: #333;
        }

        .clips-list h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .clip-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .clip-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .clip-item.active {
            background: #667eea;
            color: white;
            border-color: #764ba2;
        }

        .clip-item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .clip-item-time {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .clip-item-size {
            font-size: 0.85em;
            margin-top: 5px;
            opacity: 0.8;
        }

        .no-clips {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-clips-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ee5a52;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .clips-list {
                max-height: 400px;
            }
        }

        .refresh-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
            margin-left: 10px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Clip Viewer</h1>
            <p class="subtitle">View and manage your uploaded screen recordings</p>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Total Clips</div>
                    <div class="stat-value" id="totalClips">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Storage</div>
                    <div class="stat-value" id="totalStorage">0 MB</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Auto-refresh <span class="refresh-indicator"></span></div>
                    <div class="stat-value">5s</div>
                </div>
            </div>
        </header>

        <div id="errorContainer"></div>

        <div class="main-content">
            <div class="video-section">
                <div id="videoContainer">
                    <div class="no-clips">
                        <div class="no-clips-icon">🎬</div>
                        <h3>No clip selected</h3>
                        <p>Select a clip from the list to start viewing</p>
                    </div>
                </div>
            </div>

            <div class="clips-list">
                <h2>Uploaded Clips</h2>
                <div id="clipsList">
                    <div class="loading">Loading clips...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const BACKEND_URL = 'https://clipperwebserviceapi-1.onrender.com';
        
        let clips = [];
        let currentClipId = null;
        let refreshInterval = null;

        // Load clips from backend
        async function loadClips() {
            try {
                const response = await fetch(`${BACKEND_URL}/clips`);
                const data = await response.json();
                
                if (data.clips) {
                    clips = data.clips.sort((a, b) => 
                        new Date(b.upload_time) - new Date(a.upload_time)
                    );
                    renderClips();
                    updateStats();
                }
            } catch (error) {
                showError('Failed to load clips from server');
                console.error('Error loading clips:', error);
            }
        }

        // Render clips list
        function renderClips() {
            const clipsList = document.getElementById('clipsList');
            
            if (clips.length === 0) {
                clipsList.innerHTML = `
                    <div class="no-clips">
                        <div class="no-clips-icon">📭</div>
                        <p>No clips uploaded yet</p>
                    </div>
                `;
                return;
            }

            clipsList.innerHTML = clips.map(clip => {
                const uploadDate = new Date(clip.upload_time);
                const formattedDate = uploadDate.toLocaleString();
                const fileSize = formatFileSize(clip.file_size);
                
                return `
                    <div class="clip-item ${clip.clip_id === currentClipId ? 'active' : ''}" 
                         onclick="loadClip('${clip.clip_id}')">
                        <div class="clip-item-name">${clip.original_filename}</div>
                        <div class="clip-item-time">📅 ${formattedDate}</div>
                        <div class="clip-item-size">💾 ${fileSize}</div>
                    </div>
                `;
            }).join('');
        }

        // Load and display a clip
        function loadClip(clipId) {
            currentClipId = clipId;
            const clip = clips.find(c => c.clip_id === clipId);
            
            if (!clip) return;

            const videoContainer = document.getElementById('videoContainer');
            const videoUrl = `${BACKEND_URL}/clips/${clipId}`;
            
            videoContainer.innerHTML = `
                <video controls autoplay>
                    <source src="${videoUrl}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="clip-info">
                    <h3>Clip Information</h3>
                    <div class="clip-meta">
                        <span class="clip-meta-label">Filename:</span>
                        <span class="clip-meta-value">${clip.original_filename}</span>
                        
                        <span class="clip-meta-label">Clip ID:</span>
                        <span class="clip-meta-value">${clip.clip_id}</span>
                        
                        <span class="clip-meta-label">Uploaded:</span>
                        <span class="clip-meta-value">${new Date(clip.upload_time).toLocaleString()}</span>
                        
                        <span class="clip-meta-label">File Size:</span>
                        <span class="clip-meta-value">${formatFileSize(clip.file_size)}</span>
                        
                        <span class="clip-meta-label">Hash:</span>
                        <span class="clip-meta-value">${clip.file_hash}</span>
                    </div>
                    <div class="controls">
                        <button class="btn btn-primary" onclick="downloadClip('${clipId}')">
                            ⬇️ Download
                        </button>
                        <button class="btn btn-primary" onclick="copyLink('${clip.url}')">
                            🔗 Copy Link
                        </button>
                        <button class="btn btn-danger" onclick="deleteClip('${clipId}')">
                            🗑️ Delete
                        </button>
                    </div>
                </div>
            `;
            
            renderClips(); // Re-render to update active state
        }

        // Download clip
        function downloadClip(clipId) {
            const url = `${BACKEND_URL}/clips/${clipId}`;
            window.open(url, '_blank');
        }

        // Copy link to clipboard
        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('Link copied to clipboard!');
            });
        }

        // Delete clip
        async function deleteClip(clipId) {
            if (!confirm('Are you sure you want to delete this clip?')) {
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/delete/${clipId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    if (currentClipId === clipId) {
                        currentClipId = null;
                        document.getElementById('videoContainer').innerHTML = `
                            <div class="no-clips">
                                <div class="no-clips-icon">🎬</div>
                                <h3>No clip selected</h3>
                                <p>Select a clip from the list to start viewing</p>
                            </div>
                        `;
                    }
                    await loadClips();
                } else {
                    showError('Failed to delete clip');
                }
            } catch (error) {
                showError('Error deleting clip');
                console.error('Error:', error);
            }
        }

        // Update statistics
        function updateStats() {
            const totalClips = clips.length;
            const totalStorage = clips.reduce((sum, clip) => sum + clip.file_size, 0);
            
            document.getElementById('totalClips').textContent = totalClips;
            document.getElementById('totalStorage').textContent = formatFileSize(totalStorage);
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Show error message
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `
                <div class="error">
                    ⚠️ ${message}
                </div>
            `;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        // Check URL for clip parameter
        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const clipId = urlParams.get('clip');
            if (clipId) {
                loadClip(clipId);
            }
        }

        // Initialize
        async function init() {
            await loadClips();
            checkUrlParams();
            
            // Set up auto-refresh every 5 seconds
            refreshInterval = setInterval(loadClips, 5000);
        }

        // Start the app
        init();

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
